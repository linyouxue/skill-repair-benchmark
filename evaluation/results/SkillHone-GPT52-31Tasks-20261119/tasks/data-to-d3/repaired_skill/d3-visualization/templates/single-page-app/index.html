<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D3 Bubble + Table (Offline Template)</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="appHeader">
      <h1 class="appHeader__title">D3 Bubble + Table</h1>
      <p class="appHeader__subtitle">Offline-friendly template (D3 v6)</p>
    </header>

    <main class="layout">
      <section class="panel panel--chart" aria-label="Bubble chart">
        <div class="panel__header">
          <h2 class="panel__title">Bubble chart</h2>
          <div id="legend" class="legend" aria-label="Legend"></div>
        </div>
        <svg id="bubbleSvg" class="bubbleSvg" role="img" aria-label="Bubble chart"></svg>
      </section>

      <section class="panel panel--table" aria-label="Data table">
        <div class="panel__header">
          <h2 class="panel__title">Stocks</h2>
        </div>
        <div id="tableWrap" class="tableWrap"></div>
      </section>
    </main>

    <!-- Tooltip element (shown/hidden via CSS class) -->
    <div id="tooltip" class="tooltip" aria-hidden="true"></div>

    <!--
      IMPORTANT (offline note):
      - This template links to local JS files and a local D3 build.
      - If you load this page via file://, browsers often block fetch().
      - Prefer embedding minimal data in visualization.js, or serve this directory with a local server.
    -->

    <script src="js/d3.v6.min.js"></script>
    <script src="js/visualization.js"></script>
  </body>
</html>
