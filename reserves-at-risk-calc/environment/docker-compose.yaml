services:
  main:
    volumes:
      - ${HOST_ARTIFACTS_PATH}/task-output:/root/output
  verifier:
    image: bf__rar-verifier-calc25
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Verifier.Dockerfile
    pull_policy: build
    command: ["sleep", "infinity"]
    network_mode: none
    volumes:
      - ${HOST_ARTIFACTS_PATH}/task-output:/root/output:ro
