<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock bubbles and table (D3 v6)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="header">
    <h1>Stocks overview</h1>
    <div class="hint">Click a bubble (or its ticker label) or a table row to select. Hover bubbles for details (no tooltip for ETFs).</div>
  </div>

  <div class="app" id="app">
    <div class="layout" id="layout">
      <div class="panel panel-left" id="left-panel"></div>
      <div class="panel panel-right" id="right-panel"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <noscript>
    This page requires JavaScript to run.
  </noscript>

  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
