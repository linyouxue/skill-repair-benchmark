<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stocks: sector clusters and table</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Stocks overview</h1>
      <p class="app-subtitle">Bubble size = market cap (ETFs are uniform). Color = sector. Click a bubble or row to select.</p>
    </header>

    <main id="layout">
      <section id="bubble-panel" class="panel">
        <div class="panel-header">
          <h2>Sector clusters</h2>
          <div class="panel-subtitle">Hover a stock bubble for details (no tooltip for ETFs).</div>
        </div>
        <svg id="bubbleChart" role="img" aria-label="Bubble chart of stocks clustered by sector"></svg>
        <div id="legend" aria-label="Sector legend"></div>
      </section>

      <section id="table-panel" class="panel">
        <div class="panel-header">
          <h2>Stock list</h2>
          <div class="panel-subtitle">50 stocks with sector and market cap.</div>
        </div>
        <div class="table-wrap">
          <table id="stockTable">
            <thead>
              <tr>
                <th>Ticker symbol</th>
                <th>Full company name</th>
                <th>Sector</th>
                <th>Market cap</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip" role="dialog" aria-hidden="true"></div>

  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
