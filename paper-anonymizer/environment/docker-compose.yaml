services:
  main:
    volumes:
      - ${HOST_ARTIFACTS_PATH}/redacted:/root/redacted
  verifier:
    image: bf__paper-anonymizer-verifier:1.27.2.2
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Verifier.Dockerfile
    pull_policy: build
    command: ["sleep", "infinity"]
    network_mode: none
    volumes:
      - ${HOST_ARTIFACTS_PATH}/redacted:/root/redacted:ro
      - ${CONTEXT_DIR}:/source:ro
